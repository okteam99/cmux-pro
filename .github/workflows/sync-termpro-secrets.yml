# 一次性:把本仓库的 Apple 签名 secrets 同步到 okteam99/termpro。
# 值经 stdin 管道直达 gh secret set(客户端加密),不进日志(Actions 亦自动打码)。
# 用完即删本文件,并撤销 TERMPRO_SYNC_PAT。
name: Sync termpro signing secrets (one-time)

on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Apple secrets to okteam99/termpro
        env:
          GH_TOKEN: ${{ secrets.TERMPRO_SYNC_PAT }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            printf '%s' "${!name}" | gh secret set "$name" -R okteam99/termpro
            echo "synced $name"
          done
